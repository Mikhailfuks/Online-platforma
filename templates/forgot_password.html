{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width: 400px; margin: 40px auto;">
  <h2>Восстановление пароля</h2>
  <p class="text-muted" style="font-size: 14px; margin-bottom: 15px;">Введите email, указанный при регистрации.</p>
  <form method="post">
    <input name="email" type="email" placeholder="Ваш Email" required style="margin-bottom: 15px;">
    <button type="submit" style="width: 100%;">Отправить ссылку</button>
  </form>
  <p style="text-align: center; margin-top: 15px; font-size: 14px;">
    <a href="{{ url_for('login') }}">Вернуться ко входу</a>
  </p>
</div>
{% endblock %}
