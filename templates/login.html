{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width: 400px; margin: 40px auto;">
  <h2 style="text-align: center;">Вход</h2>
  <form method="post">
    <input name="username" placeholder="Логин или Email" required style="margin-bottom: 15px;">
    <input name="password" type="password" placeholder="Пароль" required style="margin-bottom: 15px;">
    <button type="submit" style="width: 100%;">Войти</button>
  </form>
  <p style="text-align: center; margin-top: 15px; font-size: 14px;">
    <a href="{{ url_for('forgot_password') }}">Забыли пароль?</a>
  </p>
  <p style="text-align: center; font-size: 14px;">
    Нет аккаунта? <a href="{{ url_for('register') }}">Зарегистрируйтесь</a>
  </p>
</div>
{% endblock %}
